[project]
name = "ga4-checkout-funnel"
version = "0.1.0"
description = "GA4 checkout funnel and conversion analytics on BigQuery"
requires-python = "==3.12.*"
dependencies = [
  "dbt-bigquery==1.12.1",
  "dbt-core==1.12.5",
  "google-cloud-bigquery==3.46.1",
  "python-dotenv[cli]==1.2.4",
]

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "pytest==9.1.1",
  "ruff==0.16.10",
  "sqlfluff==4.4.0",
  "sqlfluff-templater-dbt==4.4.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
